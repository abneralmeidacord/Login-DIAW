<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Recupere o acesso à sua conta IntegraMed.">
    <title>IntegraMed | Recuperar senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;family=Poppins:wght@400;500;600&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="recover-title">
            <div class="auth-content auth-content-recover">
                <a class="back-link" th:href="@{/login}" aria-label="Voltar para o login">
                    <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
                    Voltar
                </a>

                <header class="auth-header">
                    <h1 id="recover-title">Recupere sua senha</h1>
                    <p>Informe o email da sua conta para<br>receber as instruções de recuperação</p>
                </header>

                <div class="recover-icon" aria-hidden="true">
                    <span class="material-symbols-rounded">lock_reset</span>
                </div>

                <form th:action="@{/recoverpassword}" method="post" class="auth-form">
                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com" autocomplete="email"
                            required autofocus>
                    </div>

                    <button class="primary-button" type="submit">Recuperar senha</button>
                </form>

                <p class="footer-prompt">Lembrou sua senha? <a class="text-link" th:href="@{/login}">Faça login</a></p>
            </div>
        </section>

        <aside class="brand-panel" aria-hidden="true">
            <img th:src="@{/imgs/logo-ti2.png}" alt="">
        </aside>
    </main>
</body>

</html>
