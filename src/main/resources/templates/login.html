<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acesse sua conta IntegraMed.">
    <title>IntegraMed | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;family=Poppins:wght@400;500;600&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>

<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="login-title">
            <div class="auth-content">
                <header class="auth-header">
                    <h1 id="login-title">Bem-vindo ao IntegraMed</h1>
                    <p>Faça login para ter acesso<br>ao seu Dashboard IntegraMed</p>
                </header>

                <div class="feedback feedback-error" role="alert" th:if="${param.error}">
                    Email/usuário ou senha inválidos. Tente novamente.
                </div>
                <div class="feedback feedback-success" role="status" th:if="${param.logout}">
                    Sua sessão foi encerrada com sucesso.
                </div>
                <div class="feedback feedback-success" role="status" th:if="${registerSuccess}"
                    th:text="${registerSuccess}"></div>
                <div class="feedback feedback-success" role="status" th:if="${recoverSuccess}"
                    th:text="${recoverSuccess}"></div>

                <form th:action="@{/login}" method="post" class="auth-form">
                    <div class="form-field">
                        <label for="username">Email ou usuário</label>
                        <input type="text" id="username" name="username" placeholder="email@exemplo.com"
                            autocomplete="username" required autofocus>
                    </div>

                    <div class="form-field">
                        <label for="password">Senha</label>
                        <div class="password-field">
                            <input type="password" id="password" name="password" placeholder="Sua senha"
                                autocomplete="current-password" required>
                            <button class="password-toggle" type="button" data-password-toggle="password"
                                aria-label="Mostrar senha" aria-pressed="false">
                                <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                            </button>
                        </div>
                    </div>

                    <button class="primary-button" type="submit">Login</button>
                </form>

                <div class="divider" aria-hidden="true"><span>Ou</span></div>

                <a class="secondary-button" th:href="@{/register}">Cadastre-se</a>
                <a class="text-link forgot-password" th:href="@{/recoverpassword}">Esqueci a minha senha</a>
            </div>
        </section>

        <aside class="brand-panel" aria-hidden="true">
            <img th:src="@{/imgs/logo-ti2.png}" alt="">
        </aside>
    </main>
</body>

</html>
