<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>IntegraMed | Definir nova senha</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>

<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="reset-title">
            <div class="auth-content auth-content-recover">
                <header class="auth-header">
                    <h1 id="reset-title">Defina sua nova senha</h1>
                    <p>Escolha uma nova senha para acessar sua conta.</p>
                </header>

                <div class="feedback feedback-error" role="alert" th:if="${resetError}" th:text="${resetError}"></div>

                <form th:if="${tokenValido}" th:action="@{/resetpassword}" method="post" class="auth-form">
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="form-field">
                        <label for="senha">Nova senha</label>
                        <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="8"
                            placeholder="Pelo menos 8 caracteres" required autofocus>
                    </div>

                    <div class="form-field">
                        <label for="confirmacaoSenha">Confirme a nova senha</label>
                        <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" autocomplete="new-password"
                            minlength="8" placeholder="Repita a nova senha" required>
                    </div>

                    <button class="primary-button" type="submit">Salvar nova senha</button>
                </form>

                <a th:unless="${tokenValido}" class="primary-button" th:href="@{/recoverpassword}">Solicitar novo
                    link</a>

                <p class="footer-prompt">
                    <a class="text-link" th:href="@{/login}">Voltar para o login</a>
                </p>
            </div>
        </section>
        <aside class="brand-panel" aria-hidden="true">
            <img th:src="@{/imgs/logo-ti2.png}" alt="">
        </aside>
    </main>
</body>

</html>
