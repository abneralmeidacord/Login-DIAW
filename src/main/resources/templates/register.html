<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crie sua conta IntegraMed.">
    <title>IntegraMed | Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;family=Poppins:wght@400;500;600&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script th:src="@{/js/auth.js}" defer></script>
</head>

<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-panel" aria-labelledby="register-title">
            <div class="auth-content auth-content-compact">
                <header class="auth-header">
                    <h1 id="register-title">Crie sua conta</h1>
                    <p>Preencha seus dados para começar<br>a usar o IntegraMed</p>
                </header>

                <div class="feedback feedback-error" role="alert" th:if="${registerError}" th:text="${registerError}">
                </div>

                <form th:action="@{/register}" method="post" class="auth-form">
                    <div class="form-field">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"
                            autocomplete="name" minlength="3" required autofocus>
                    </div>

                    <div class="form-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="email@exemplo.com" autocomplete="email"
                            required>
                    </div>

                    <div class="form-row">
                        <div class="form-field">
                            <label for="senha">Senha</label>
                            <div class="password-field">
                                <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres"
                                    autocomplete="new-password" minlength="8" required>
                                <button class="password-toggle" type="button" data-password-toggle="senha"
                                    aria-label="Mostrar senha" aria-pressed="false">
                                    <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                                </button>
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="confirmacaoSenha">Confirme a senha</label>
                            <div class="password-field">
                                <input type="password" id="confirmacaoSenha" name="confirmacaoSenha"
                                    placeholder="Digite novamente" autocomplete="new-password" minlength="8" required>
                                <button class="password-toggle" type="button" data-password-toggle="confirmacaoSenha"
                                    aria-label="Mostrar confirmação da senha" aria-pressed="false">
                                    <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <button class="primary-button" type="submit">Cadastrar</button>
                </form>

                <p class="footer-prompt">Já possui uma conta? <a class="text-link" th:href="@{/login}">Faça login</a>
                </p>
            </div>
        </section>

        <aside class="brand-panel" aria-hidden="true">
            <img th:src="@{/imgs/logo-ti2.png}" alt="">
        </aside>
    </main>
</body>

</html>
