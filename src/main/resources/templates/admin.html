<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntegraMed | Administração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&amp;family=Poppins:wght@400;500;600&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <main class="status-card">
        <div class="status-icon" aria-hidden="true">
            <span class="material-symbols-rounded">admin_panel_settings</span>
        </div>
        <p class="eyebrow">Acesso administrativo</p>
        <h1>Painel IntegraMed</h1>
        <p class="status-message">Você entrou com um perfil de administrador e possui acesso a esta área protegida.</p>
        <form th:action="@{/logout}" method="post">
            <button class="status-button" type="submit">Encerrar sessão</button>
        </form>
    </main>
</body>

</html>
